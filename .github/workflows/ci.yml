name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # postinstall runs `wrangler types`, which generates worker-configuration.d.ts.
      # That file is gitignored, so typecheck depends on this step having run.
      - run: npm ci

      # `build` (below) now runs the Playwright e2e suite as part of itself,
      # so its browser must be present before that step runs.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The DST and ISO-week cases in test/shared/dates.test.ts pass trivially
      # under UTC. This run is the one that can actually catch a local-time bug.
      - name: Test under a DST timezone
        run: npm run test:tz

      - name: Build
        run: npm run build

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `deploy` runs `predeploy` (config sanity check) and `build` first —
      # and `build` now runs the Playwright e2e suite — before `wrangler
      # deploy`. Same script a human runs locally, so CI can't drift from
      # the documented release process.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Deploy applies pending migrations to production, so take a restore
      # point and an off-site dump first. Fails the job (no deploy) if the
      # backup can't be made.
      - name: Back up production database
        run: bash scripts/backup-to-sftp.sh pre-deploy-${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKUP_SSH_KEY: ${{ secrets.BACKUP_SSH_KEY }}
          BACKUP_SSH_KNOWN_HOSTS: ${{ secrets.BACKUP_SSH_KNOWN_HOSTS }}
          BACKUP_SFTP_HOST: ${{ secrets.BACKUP_SFTP_HOST }}
          BACKUP_SFTP_PORT: ${{ secrets.BACKUP_SFTP_PORT }}
          BACKUP_SFTP_USER: ${{ secrets.BACKUP_SFTP_USER }}
          BACKUP_SFTP_PATH: ${{ secrets.BACKUP_SFTP_PATH }}

      - name: Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
